name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt JS-based actions (checkout, setup-node, pnpm/action-setup) onto
  # Node 24 ahead of the 2026-06-02 deprecation flip. Removes the
  # deprecation annotation on every run.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  go:
    name: go (vet + lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Reuse the dev compose stack for integration-test deps (Mongo +
      # Redis) — single source of truth for service versions/config so
      # CI can't drift from local. `--wait` blocks until each service's
      # compose-declared healthcheck passes, eliminating connect races.
      # docker compose ships pre-installed on ubuntu-latest runners.
      - name: start service deps (mongo + redis)
        run: docker compose up -d --wait mongodb redis

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Unit tier — fast, no service deps. Always runs first so a unit
      # regression surfaces before paying the integration startup cost.
      - name: go test (unit)
        run: go test -race -count=1 ./...

      # Integration tier — gated by `-tags=integration`. Suites fail
      # loud if Mongo/Redis unreachable (no skip path), so the compose
      # `--wait` step above must succeed before this point.
      - name: go test (integration)
        run: go test -tags=integration -race -count=1 ./...
        env:
          MONGO_URI: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379

      - name: golangci-lint
        run: go tool -modfile=tools/go.mod golangci-lint run ./...

  ui:
    name: ui (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: internal/ui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: internal/ui/pnpm-lock.yaml

      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: build
        run: pnpm build
